spring:
  application:
    name: spring-org
  jackson:
    mapper:
      # Accepter "polyline"/"POLYLINE"/"Polyline" indifferemment pour les enums.
      accept-case-insensitive-enums: true
  # Le chargement des donnees (graphe routier, index adresses) peut etre long :
  # on autorise un demarrage tranquille.
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080

# ---------------------------------------------------------------------------
# Configuration applicative : emplacement des donnees locales.
# Tout est local, aucune API externe n'est appelee a l'execution.
# ---------------------------------------------------------------------------
app:
  # Telechargement automatique des donnees.
  data:
    # Telecharger les fichiers manquants au demarrage.
    auto-download: ${APP_AUTO_DOWNLOAD:true}
    # Mise a jour automatique : tous les dimanches a 8h (cron Spring : s m h ...).
    update-cron: ${APP_UPDATE_CRON:0 0 8 * * SUN}
    # Verifier aussi AU DEMARRAGE (une fois les moteurs charges avec les donnees existantes) si
    # une version plus recente des donnees est publiee (requete HEAD, comparaison Last-Modified
    # avec la version locale) et, si oui, la telecharger puis reconstruire graphe/index a chaud.
    # Deja a jour = rien n'est telecharge. Sans effet si auto-download=false.
    update-on-start: ${APP_UPDATE_ON_START:true}
    # Robustesse des telechargements. L'extrait OSM France fait ~5 Go : une coupure reseau a
    # 80 % du transfert faisait perdre les 4 Go deja recus et echouer la mise a jour jusqu'au
    # prochain declenchement. Une tentative qui echoue est donc REPRISE la ou elle s'est
    # arretee (HTTP Range + If-Range : si la version publiee change entre-temps, le transfert
    # repart de zero au lieu de melanger deux versions).
    download:
      # Nombre total de tentatives pour un meme fichier (1 = comportement d'origine, sans reprise).
      # Un echec definitif (404, espace disque insuffisant) arrete la boucle immediatement.
      max-attempts: ${APP_DOWNLOAD_ATTEMPTS:5}
      # Attente avant la 2e tentative, doublee ensuite (15 s, 30 s, 60 s, 120 s).
      retry-delay-seconds: ${APP_DOWNLOAD_RETRY_DELAY:15}
      # Duree sans le moindre octet recu au-dela de laquelle le transfert est considere bloque
      # et interrompu (une nouvelle tentative reprend). Le timeout HTTP ne couvre PAS la lecture
      # du corps de la reponse : sans ce garde-fou, un serveur muet bloquait la mise a jour
      # indefiniment et empechait toutes les suivantes.
      stall-timeout-seconds: ${APP_DOWNLOAD_STALL_TIMEOUT:180}
  routing:
    # Extrait OSM de la France (https://download.geofabrik.de/europe/france.html)
    osm-file: ${APP_OSM_FILE:data/france-latest.osm.pbf}
    osm-url: ${APP_OSM_URL:https://download.geofabrik.de/europe/france-latest.osm.pbf}
    # Dossier de cache du graphe construit par GraphHopper (genere au 1er demarrage)
    graph-cache: ${APP_GRAPH_CACHE:data/graph-cache}
    profile: car
    # Contraction Hierarchies : indispensable pour des matrices rapides (50x50)
    use-ch: true
    # Distance maximale (en metres) toleree entre un point demande et la route la plus
    # proche. Au-dela, le point est ECARTE de l'optimisation (statut TOO_FAR) au lieu
    # d'etre rattache a une route lointaine. 0 = desactive (tout point routable accepte).
    max-snap-distance-meters: ${APP_MAX_SNAP_DISTANCE:1000}
  optimization:
    # Attente maximale toleree (en secondes) devant une fenetre horaire pas encore ouverte.
    # Au-dela, l'arret est considere comme ne correspondant pas au creneau (contrainte dure :
    # le solveur reordonne pour l'eviter, sinon feasible=false + timeWindowStatus=WAITING_TOO_LONG).
    # Surchargeable par requete (`maxWaitingSeconds`). 0 = desactive (attente illimitee).
    max-waiting-seconds: ${APP_MAX_WAITING_SECONDS:3600}
    # POST /optimization/dispatch (repartition de N points en K tournees equilibrees) : temps de
    # resolution alloue au solveur, en secondes. Plus il est long, meilleure est la repartition
    # (100 points / 5 tournees : ~10 s correct, ~20-30 s tres bon). `default` s'applique quand la
    # requete ne fournit pas `maxSolvingSeconds` ; `max` plafonne la valeur demandee (protege le serveur :
    # un solveur occupe un thread pendant toute la duree). Independant de timefold.solver.termination
    # (qui reste la limite de /optimization/optimize).
    dispatch:
      default-solving-seconds: ${APP_DISPATCH_SOLVING_SECONDS:10}
      max-solving-seconds: ${APP_DISPATCH_MAX_SOLVING_SECONDS:60}
    # Missions appairees (`shipments` : chargement -> enlevement) sur POST /optimization/optimize.
    # Elles ajoutent deux contraintes dures (meme vehicule, chargement d'abord) que l'heuristique de
    # construction ignore : le solveur doit d'abord REPARER la precedence avant d'optimiser, ce que la
    # terminaison globale de 1 s (timefold.solver.termination, cf. plus bas) ne permet pas. Des qu'une
    # requete /optimize contient des missions, ce budget-ci s'applique a la place ; `default` vaut
    # quand la requete ne fournit pas `maxSolvingSeconds`, `max` plafonne la valeur demandee.
    # Sans `shipments`, RIEN ne change : la terminaison globale reste en vigueur.
    # (/optimization/dispatch garde son propre budget, ci-dessus.)
    shipments:
      default-solving-seconds: ${APP_SHIPMENTS_SOLVING_SECONDS:5}
      max-solving-seconds: ${APP_SHIPMENTS_MAX_SOLVING_SECONDS:60}
  geocoding:
    # Fichier BAN (https://adresse.data.gouv.fr/data/ban/adresses/latest/csv)
    # adresses-france.csv.gz (semicolon-separated, gzip)
    ban-file: ${APP_BAN_FILE:data/adresses-france.csv.gz}
    ban-url: ${APP_BAN_URL:https://adresse.data.gouv.fr/data/ban/adresses/latest/csv/adresses-france.csv.gz}
    # Dossier de l'index Lucene (genere au 1er demarrage a partir du CSV)
    index-dir: ${APP_INDEX_DIR:data/address-index}
    # Forcer la reconstruction de l'index meme s'il existe deja
    rebuild-on-start: ${APP_INDEX_REBUILD:false}
    # Biais de proximite (/geocoding/search?lat=&lon=) : echelle de decroissance en metres.
    # finalScore = scoreTexte * scale / (scale + distance). A `scale` metres, le score est divise
    # par 2 ; au-dela il decroit doucement. Plus la valeur est petite, plus la proximite domine.
    proximity-scale-meters: ${APP_GEOCODING_PROXIMITY_SCALE:10000}
  notifications:
    # Webhook Discord ou sont signalees les erreurs de l'API : 503 (routing/geocoding
    # indisponible), visites ecartees d'une optimisation (UNROUTABLE/TOO_FAR), depot
    # non rattachable, erreurs internes inattendues (500). Y sont aussi publies les
    # comptes rendus de mise a jour des donnees (demarrage + cron : declencheur, machine,
    # versions, tailles, noeuds/aretes/adresses, durees). Vide = desactive.
    discord-webhook-url: ${APP_DISCORD_WEBHOOK:}

# ---------------------------------------------------------------------------
# Solveur Timefold : temps alloue a l'optimisation d'une tournee.
# ---------------------------------------------------------------------------
timefold:
  solver:
    termination:
      spent-limit: 1s

# ---------------------------------------------------------------------------
# Documentation OpenAPI / Swagger
#   UI   : http://localhost:8080/swagger-ui.html
#   JSON : http://localhost:8080/v3/api-docs
# ---------------------------------------------------------------------------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

logging:
  level:
    bzh.stackbzh.org: INFO
    com.graphhopper: WARN
